name: Build worker release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.11"
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --force-reinstall "torch==2.6.0" "torchvision==0.21.0" --index-url https://download.pytorch.org/whl/cu124
      - name: Verify model assets
        shell: pwsh
        run: |
          if (!(Test-Path "Modals\yolov11\yolo11x.pt")) { throw "Missing YOLO11 model" }
          if (!(Test-Path "Modals\yolov26\yolo26x.pt")) { throw "Missing YOLO26 model" }
      - name: Build worker
        shell: pwsh
        run: .\build_worker.ps1
      - name: Archive worker
        shell: pwsh
        run: |
          Compress-Archive -Path dist\football-worker -DestinationPath football-worker.zip
          [long]$chunkSize = 1900MB
          $buffer = New-Object byte[] (4MB)
          $input = [System.IO.File]::OpenRead("football-worker.zip")
          $index = 1
          try {
            while ($input.Position -lt $input.Length) {
              $suffix = "{0:D3}" -f $index
              $output = [System.IO.File]::Create("football-worker.zip.$suffix")
              try {
                [long]$remaining = [math]::Min([long]$chunkSize, [long]($input.Length - $input.Position))
                while ($remaining -gt 0) {
                  $read = $input.Read($buffer, 0, [int][math]::Min([long]$buffer.Length, $remaining))
                  if ($read -le 0) { break }
                  $output.Write($buffer, 0, $read)
                  $remaining -= $read
                }
              } finally {
                $output.Dispose()
              }
              $index++
            }
          } finally {
            $input.Dispose()
          }
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: football-worker.zip.*
